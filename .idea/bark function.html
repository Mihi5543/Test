<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="UTF-8">
        <title>Bark function</title>
    </head>
    <body>
        <script>
            function bark(name, weight){
                if(weight > 20){
                    console.log(name + " says WOOF WOOF");
                } else {
                    console.log(name + " says woof woof");
                }
            }

            bark("rover", 23);
            bark("spot", 13);
            bark("spike", 53);
            bark("lady", 17);
        </script>
        <h1>Test page for the bark function</h1>
    </body>
</html>
